# DO NOT EDIT
# This file is generated by mise-en-orbeet, and *will* be overwritten

[settings]
env_shell_expand = true

[tools]
go = "1.26.8"
"go:github.com/t-yuki/gocover-cobertura" = "latest"
"go:golang.org/x/tools/gopls" = "v0.23.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.7.0"
golangci-lint = "2.13.1"
tombi = "v1.1.1"

[vars]
mise_en_orbeet_dl_baseurl = "https://orus.io/orbeet/mise-modules/-/archive/"
project_name = "{{ config_root | basename }}"

[tasks.cover]
description = "Run the tests with coverage"
run = """
go test ./tests -cover -coverprofile tests-coverage.out -coverpkg $(
  go list ./... | grep -v "keepitall" | xargs | sed 's/ /,/g'
)
gocover-cobertura < tests-coverage.out > tests-coverage.xml
go tool cover -html=tests-coverage.out -o tests-coverage.html
"""

[tasks.fetch-all]
depends = ["go-mod-download"]
description = "Fetch all"

[tasks.generate]
depends = []
description = "Generate all needed source files"

[tasks.go-mod-download]
run = "go mod download -x"

[tasks.lint]
description = "Run linters on the codebase"
run = "golangci-lint run"
wait_for = ["generate"]

[tasks.lint-fix]
description = "Run linters and fix issues where possible"
run = "golangci-lint run --fix"
wait_for = ["generate"]

[tasks.mise-en-orbeet-post-install]
description = """Run after orbeet-up installs the modules. Any task can add itself as a dependency of this task."""
hide = true

[tasks.orbeet-up]
description = "Update the mise-en-orbeet fileset"
run = "mise-en-orbeet --target . bootstraped-install"

[tasks.orbeet-up.tools]
[tasks.orbeet-up.tools."gitlab:orus-io/mise-en-orbeet"]
version = "0.13.0"
api_url = "https://orus.io/api/v4"

[tasks.test]
depends = ["generate"]
description = "Run the tests"
run = "go test {{ usage.packages }}"
usage = """
arg "<packages>" help="packages to test" default="./..."
"""

[tasks.vulncheck]
depends = ["generate"]
description = "Search for known vulnerabilities in our code and our libraries"
run = "govulncheck ./..."
